name: Build and Push Images

on:
  push:
    branches:
      - main
    # Verhindert eine Endlosschleife: der Promotion-Commit des "promote"-Jobs
    # unten aendert nur diese Datei und darf keinen neuen Lauf ausloesen.
    paths-ignore:
      - helm/user-mgmt/values.yaml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            build_args: ""
          - service: frontend
            context: ./frontend
            # Next.js backt NEXT_PUBLIC_* zur Build-Zeit ins Bundle ein.
            # Der Ingress routet /api auf das Spring-Boot-Backend.
            build_args: |
              NEXT_PUBLIC_API_URL=https://lucavonsaal.com/api
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}:${{ github.sha }}
          build-args: ${{ matrix.build_args }}

  promote:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Image-Tags in Helm values.yaml setzen
        run: |
          yq -i '.backend.image.tag = "${{ github.sha }}"' helm/user-mgmt/values.yaml
          yq -i '.frontend.image.tag = "${{ github.sha }}"' helm/user-mgmt/values.yaml

      - name: Commit und Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/user-mgmt/values.yaml
          git diff --cached --quiet && { echo "keine Aenderung"; exit 0; }
          git commit -m "chore: promote images to ${{ github.sha }} [skip ci]"
          git push
