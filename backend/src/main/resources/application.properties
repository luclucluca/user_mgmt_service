spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.issuer=${JWT_ISSUER}
jwt.secret=${JWT_SECRET}
jwt.expiration-millis=${JWT_EXPIRATION_MILLIS}

spring.application.name=user-mgmt-backend

logging.level.org.springframework.security=DEBUG

management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# module_service (Aufgabe 6): gleicher Namespace wie das Backend, daher kurzer Servicename.
module-service.base-url=${MODULE_SERVICE_BASE_URL:http://module-service:8080}
module-service.timeout-millis=${MODULE_SERVICE_TIMEOUT_MILLIS:2000}

resilience4j.circuitbreaker.instances.moduleService.sliding-window-size=10
resilience4j.circuitbreaker.instances.moduleService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.moduleService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.moduleService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.moduleService.permitted-number-of-calls-in-half-open-state=3
# 4xx (z.B. Modul nicht gefunden) ist kein transientes Problem und darf den Circuit Breaker nicht oeffnen.
resilience4j.circuitbreaker.instances.moduleService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

resilience4j.retry.instances.moduleService.max-attempts=3
resilience4j.retry.instances.moduleService.wait-duration=200ms
resilience4j.retry.instances.moduleService.ignore-exceptions=org.springframework.web.client.HttpClientErrorException