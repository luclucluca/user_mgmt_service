apiVersion: v1
kind: ConfigMap
metadata:
  name: module-service-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "module-service.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MYSQL_SSL_DISABLED: {{ .Values.config.mysqlSslDisabled | quote }}
