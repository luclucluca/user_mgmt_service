apiVersion: v1
kind: Service
metadata:
  name: module-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "module-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "module-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: module-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "module-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "module-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "module-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: module-service
          image: {{ include "module-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          envFrom:
            - configMapRef:
                name: module-service-config
            - secretRef:
                name: {{ include "module-service.secretName" . }}
          startupProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /docs
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
