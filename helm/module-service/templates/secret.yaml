{{- if .Values.secrets.create -}}
{{/* Im GitOps-Ablauf steht secrets.create auf false, siehe values.yaml. */}}
apiVersion: v1
kind: Secret
metadata:
  name: module-service-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "module-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DATABASE_URL fuer module_service (SQLAlchemy), MYSQL_* Einzelwerte fuer den
  # Schema-Init-Job (mysql-CLI kann keine SQLAlchemy-URL parsen).
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  MYSQL_HOST: {{ .Values.secrets.mysqlHost | default "CHANGEME" | quote }}
  MYSQL_PORT: {{ .Values.secrets.mysqlPort | default "25060" | quote }}
  MYSQL_USER: {{ .Values.secrets.mysqlUser | default "CHANGEME" | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | default "CHANGEME" | quote }}
  MYSQL_DB: {{ .Values.secrets.mysqlDb | default "module_service" | quote }}
{{- end }}
