{{- $name := include "user-mgmt.componentName" (dict "ctx" $ "component" "backend") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "user-mgmt.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "user-mgmt.componentLabels" (dict "ctx" $ "component" "backend") | nindent 4 }}
spec:
  # Kein "replicas", solange der HPA aktiv ist - sonst ueberschreiben sich Autoscaler und GitOps gegenseitig.
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.backend.strategy.type }}
    {{- if eq .Values.backend.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.backend.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.backend.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "backend") | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ include "user-mgmt.image" (dict "ctx" $ "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "user-mgmt.configMapName" . }}
            - secretRef:
                name: {{ include "user-mgmt.secretName" . }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
