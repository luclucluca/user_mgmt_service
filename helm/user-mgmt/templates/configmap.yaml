apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-mgmt.configMapName" . }}
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
data:
  # --- PostgreSQL ---
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}

  # --- Spring Boot ---
  # Der Hostname kommt aus dem Helper, nicht hartcodiert: das Backend erreicht
  # die Datenbank ausschliesslich ueber den Kubernetes Service.
  SPRING_DATASOURCE_URL: {{ include "user-mgmt.datasourceUrl" . | quote }}
  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.config.ddlAuto | quote }}

  # --- JWT (nicht sensitiv) ---
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_EXPIRATION_MILLIS: {{ .Values.config.jwtExpirationMillis | quote }}
