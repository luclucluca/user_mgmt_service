apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "user-mgmt.configMapName" . }}
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
data:
  # --- PostgreSQL ---
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}

  # --- Spring Boot ---
  # Default fuer den selbst betriebenen Postgres (postgres.enabled=true, z.B. Staging).
  # Bei postgres.enabled=false (Prod, Aufgabe 4) ueberschreibt das Secret diesen Wert mit
  # der Managed-PostgreSQL-URL (envFrom: ConfigMap vor Secret, siehe backend.yaml).
  SPRING_DATASOURCE_URL: {{ include "user-mgmt.datasourceUrl" . | quote }}
  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.config.ddlAuto | quote }}

  # --- JWT (nicht sensitiv) ---
  JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  JWT_EXPIRATION_MILLIS: {{ .Values.config.jwtExpirationMillis | quote }}

  # --- module_service (Aufgabe 6) ---
  MODULE_SERVICE_BASE_URL: {{ .Values.config.moduleServiceBaseUrl | quote }}
