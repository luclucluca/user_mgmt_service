{{- $name := include "user-mgmt.componentName" (dict "ctx" $ "component" "frontend") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "user-mgmt.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "user-mgmt.componentLabels" (dict "ctx" $ "component" "frontend") | nindent 4 }}
spec:
  # Kein "replicas" im Manifest, solange der HPA aktiv ist. Sonst schreibt
  # jeder "helm upgrade" bzw. jeder ArgoCD-Sync mit selfHeal=true die vom HPA
  # gesetzte Replica-Zahl auf den Chart-Wert zurueck - Autoscaler und GitOps
  # wuerden sich dauerhaft gegenseitig ueberschreiben.
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicaCount }}
  {{- end }}
  # RollingUpdate mit maxUnavailable 0 - waehrend eines Updates darf nie eine
  # Replica unter den Sollstand fallen. Kubernetes startet zuerst den neuen
  # Pod, wartet dessen readinessProbe ab und entfernt erst dann den alten,
  # damit ist das Deployment unterbrechungsfrei.
  #
  # maxSurge 1 begrenzt den dabei zusaetzlich benoetigten Platz auf genau
  # einen Pod. Wichtig auf einem knappen Node - passt dieser eine Pod nicht
  # mehr, bleibt das Update haengen (Pending) statt durchzulaufen.
  strategy:
    type: {{ .Values.frontend.strategy.type }}
    {{- if eq .Values.frontend.strategy.type "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.frontend.strategy.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.frontend.strategy.rollingUpdate.maxSurge }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.componentSelectorLabels" (dict "ctx" $ "component" "frontend") | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "user-mgmt.image" (dict "ctx" $ "image" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
          # Hinweis: NEXT_PUBLIC_API_URL wird von Next.js zur Build-Zeit ins
          # Bundle eingebacken und laesst sich hier zur Laufzeit nicht aendern.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.frontend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.frontend.probes.startup.failureThreshold }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.frontend.probes.readiness.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ .Values.frontend.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
