{{- if .Values.secrets.create -}}
{{/* Im GitOps-Ablauf steht secrets.create auf false, siehe values.yaml. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "user-mgmt.secretName" . }}
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
type: Opaque
stringData:
  # DB-Zugangsdaten: werden sowohl von PostgreSQL (POSTGRES_USER/POSTGRES_PASSWORD)
  # als auch vom Backend (SPRING_DATASOURCE_*) verwendet.
  SPRING_DATASOURCE_USERNAME: {{ .Values.secrets.datasourceUsername | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.datasourcePassword | quote }}

  # HMAC-Signaturschluessel fuer die JWTs
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
{{- end }}
