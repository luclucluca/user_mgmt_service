ingress:
  hosts:
    - staging.lucavonsaal.com
  tls:
    clusterIssuer: letsencrypt-staging

# Staging faehrt schmaler als Prod: minReplicas 1 haelt den Grundverbrauch klein.
backend:
  autoscaling:
    minReplicas: 1
    maxReplicas: 2

# Muss maxReplicas + 1 Surge-Pod abdecken, sonst scheitert der HPA still an "exceeded quota".
resourceQuota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi

# Backend bleibt auf Prod-Groesse: zu wenig CPU beim Start laesst die startupProbe wiederholt fehlschlagen.
frontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
