ingress:
  hosts:
    - staging.lucavonsaal.com
  tls:
    clusterIssuer: letsencrypt-staging

resourceQuota:
  requestsCpu: "1"
  requestsMemory: 2Gi
  # limits.* braucht Puffer ueber die Summe der Steady-State-Limits hinaus:
  # bei einem Rolling Update laufen alter und neuer Pod kurz nebeneinander.
  # Die tatsaechliche Kapazitaetsgrenze ist ohnehin die Node ueber requests.*,
  # nicht dieser Wert.
  limitsCpu: "4"
  limitsMemory: 4Gi

# Backend bleibt auf Groesse des Basis-values.yaml (= Prod): eine JVM/Spring-Boot-
# App braucht beim Start ausreichend CPU zum Class-Loading, sonst faellt die
# startupProbe wiederholt aus (Container wird vor vollstaendigem Hochfahren
# gekillt). Nur Frontend und Postgres sind hier reduziert.

frontend:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
