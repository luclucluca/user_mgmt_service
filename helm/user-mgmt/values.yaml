# Zentrale Konfiguration des Charts. Kein Wert darf in den Templates
# hartcodiert sein - alles Umgebungsabhaengige gehoert hierher.

nameOverride: ""
fullnameOverride: ""
# Registry-Defaults. Einzelne Komponenten koennen "registry" und "repository"
# ueberschreiben (siehe postgres), "name" und "tag" stehen immer pro Komponente.
image:
  registry: ghcr.io
  repository: luclucluca
  pullPolicy: Always
# ---------------------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------------------
backend:
  # Nur wirksam, wenn autoscaling.enabled=false. Ist der HPA aktiv, steht die
  # Replica-Zahl bewusst nicht im Manifest (siehe Kommentar in backend.yaml).
  replicaCount: 1
  # -------------------------------------------------------------------------
  # Horizontal Pod Autoscaler (Aufgabe 6)
  # -------------------------------------------------------------------------
  autoscaling:
    enabled: true
    # minReplicas: 2 statt 1 - erst ab zwei Replicas ist die Applikation
    # hochverfuegbar und ein PDB ueberhaupt wirksam.
    minReplicas: 2
    # Obergrenze aus der Node-Kapazitaet abgeleitet, nicht frei gegriffen:
    # 4 x 320Mi request = 1.25Gi allein fuers Backend. Wird maxReplicas hoeher
    # gesetzt als Node bzw. ResourceQuota hergeben, skaliert der HPA zwar, die
    # zusaetzlichen Pods bleiben aber Pending.
    maxReplicas: 4
    # Bezugsgroesse ist der CPU-*request* (200m), nicht das Limit:
    # skaliert wird ab 140m tatsaechlicher Last pro Pod.
    targetCPUUtilizationPercentage: 70
    # Speicher bewusst nicht als Skalierungsmetrik: eine JVM gibt einmal
    # allozierten Heap kaum zurueck, der Wert bliebe dauerhaft hoch und
    # wuerde ein Herunterskalieren verhindern.
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        # Sofort hochskalieren - Last soll nicht auf ein Fenster warten.
        stabilizationWindowSeconds: 0
      scaleDown:
        # 5 Minuten abwarten, bevor reduziert wird (gegen Flapping).
        stabilizationWindowSeconds: 300
  # -------------------------------------------------------------------------
  # Update- und Wartungsverhalten (Aufgabe 6)
  # -------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 0 = zu keinem Zeitpunkt weniger als der Sollstand -> kein Unterbruch.
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  image:
    name: user_mgmt_service-backend
    tag: 750c9a32dd6a4ff44adcf5920822e1905583f0a6
  service:
    port: 8080
  # Gemessen im laufenden Cluster (kubectl top): ~215Mi im Leerlauf.
  # request 320Mi deckt das mit Reserve fuer Last und GC ab; die vorherigen
  # 512Mi haben den Node blockiert, ohne je gebraucht zu werden.
  # limit bleibt 1Gi, damit die JVM unter Last Luft hat.
  resources:
    requests:
      cpu: 200m
      memory: 320Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Spring Boot bringt keinen Actuator mit, daher TCP-Probes.
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      periodSeconds: 10
    liveness:
      periodSeconds: 20
# ---------------------------------------------------------------------------
# Frontend (Next.js)
# ---------------------------------------------------------------------------
# Hinweis: NEXT_PUBLIC_API_URL wird von Next.js zur Build-Zeit ins Bundle
# eingebacken (siehe frontend/Dockerfile) und laesst sich hier nicht setzen.
frontend:
  replicaCount: 1
  # Aufgabe 6 verlangt Autoscaling ausdruecklich fuer das Backend. Das Frontend
  # liefert statische Seiten aus und ist nicht der Engpass - der Block ist
  # vorbereitet, aber abgeschaltet.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
      scaleDown:
        stabilizationWindowSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  image:
    name: user_mgmt_service-frontend
    tag: 750c9a32dd6a4ff44adcf5920822e1905583f0a6
  service:
    port: 3000
  # Gemessen: ~127Mi im Leerlauf.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 24
    readiness:
      periodSeconds: 10
    liveness:
      periodSeconds: 20
# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgres:
  image:
    registry: docker.io
    repository: library
    name: postgres
    tag: "16-alpine"
  service:
    port: 5432
  # Unterverzeichnis, damit "lost+found" des ext4-Volumes initdb nicht blockiert.
  pgData: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    storageClass: do-block-storage
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /var/lib/postgresql/data
  # Gemessen: ~43Mi im Leerlauf. Der Datenbestand ist klein, PostgreSQL nutzt
  # darueber hinaus den Page Cache des Nodes statt eigenen Speicher.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
# ---------------------------------------------------------------------------
# Nicht sensitive Konfiguration -> ConfigMap
# ---------------------------------------------------------------------------
config:
  postgresDb: postgres
  # "update" statt "create": das PVC ist persistent, das Schema darf beim
  # Pod-Restart nicht neu erzeugt (und damit geleert) werden.
  ddlAuto: update
  jwtIssuer: Spring
  jwtExpirationMillis: "86400000"
# ---------------------------------------------------------------------------
# Sensitive Konfiguration -> Secret
# ---------------------------------------------------------------------------
secrets:
  # false: das Secret wird NICHT vom Chart verwaltet. Es muss einmalig pro
  # Namespace per kubectl angelegt werden. Notwendig fuer GitOps, weil ArgoCD
  # exakt das deployt, was im (oeffentlichen) Ops-Repository steht - Passwoerter
  # duerfen dort nicht auftauchen.
  #
  #   kubectl create secret generic user-mgmt-secret -n user-mgmt \
  #     --from-literal=SPRING_DATASOURCE_USERNAME=postgres \
  #     --from-literal=SPRING_DATASOURCE_PASSWORD='<passwort>' \
  #     --from-literal=JWT_SECRET='<base64-schluessel>'
  #
  # true: der Chart erzeugt das Secret aus den Werten unten. Nur sinnvoll bei
  # lokalem Deployment mit --set, nicht im GitOps-Ablauf.
  create: false
  # Name eines bereits bestehenden Secrets. Leer = "<fullname>-secret".
  existingSecret: ""
  # Werden nur ausgewertet, wenn create=true.
  datasourceUsername: postgres
  datasourcePassword: CHANGEME
  jwtSecret: CHANGEME
# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # Verteilalgorithmus des Ingress Controllers ueber die ready Endpoints.
  # "round_robin" ist der Default von ingress-nginx und hier bewusst
  # ausgeschrieben (siehe Kommentar in templates/ingress.yaml).
  loadBalance: round_robin
  hosts:
    - lucavonsaal.com
    - www.lucavonsaal.com
  api:
    # Nur /api/users, nicht /api: das Frontend hat eigene Next.js Route Handler
    # unter /api/login, /api/me und /api/logout. Eine Regel auf /api wuerde die
    # ans Backend schicken, das nur /users/** kennt.
    path: /api/users(/|$)(.*)
    rewriteTarget: /users$1$2
  tls:
    enabled: true
    secretName: user-mgmt-tls
    # Der ClusterIssuer selbst ist clusterweite Infrastruktur und wird nicht vom
    # Chart verwaltet, sondern von k8s/setup-cluster.sh angelegt.
    clusterIssuer: letsencrypt-prod
# ---------------------------------------------------------------------------
# ResourceQuota (pro Namespace/Umgebung, siehe values-staging.yaml/values-prod.yaml)
# ---------------------------------------------------------------------------
resourceQuota:
  enabled: true
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 4Gi
# ---------------------------------------------------------------------------
# NetworkPolicy: erlaubt eingehenden Traffic nur aus dem eigenen Namespace und
# aus dem Ingress-Controller-Namespace, isoliert damit von anderen Namespaces
# (z.B. der jeweils anderen Umgebung im selben Cluster).
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  allowFromNamespace: ingress-nginx
