# Zentrale Konfiguration des Charts. Kein Wert darf in den Templates
# hartcodiert sein - alles Umgebungsabhaengige gehoert hierher.

nameOverride: ""
fullnameOverride: ""
# Registry-Defaults. Einzelne Komponenten koennen "registry" und "repository"
# ueberschreiben (siehe postgres), "name" und "tag" stehen immer pro Komponente.
image:
  registry: ghcr.io
  repository: luclucluca
  pullPolicy: Always
# ---------------------------------------------------------------------------
# Backend (Spring Boot)
# ---------------------------------------------------------------------------
backend:
  # Nur wirksam, wenn autoscaling.enabled=false. Ist der HPA aktiv, steht die
  # Replica-Zahl bewusst nicht im Manifest (siehe Kommentar in backend.yaml).
  replicaCount: 1
  # -------------------------------------------------------------------------
  # Horizontal Pod Autoscaler (Aufgabe 6)
  # -------------------------------------------------------------------------
  autoscaling:
    enabled: true
    # minReplicas: 2 statt 1 - erst ab zwei Replicas ist die Applikation
    # hochverfuegbar und ein PDB ueberhaupt wirksam.
    minReplicas: 2
    # Obergrenze an Node-Kapazitaet/ResourceQuota ausgerichtet, sonst bleiben Pods Pending.
    maxReplicas: 4
    # Bezugsgroesse ist der CPU-*request* (200m), nicht das Limit:
    # skaliert wird ab 140m tatsaechlicher Last pro Pod.
    targetCPUUtilizationPercentage: 70
    # Speicher bewusst keine Skalierungsmetrik: JVM-Heap sinkt kaum, wuerde Runterskalieren verhindern.
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        # Sofort hochskalieren - Last soll nicht auf ein Fenster warten.
        stabilizationWindowSeconds: 0
      scaleDown:
        # 5 Minuten abwarten, bevor reduziert wird (gegen Flapping).
        stabilizationWindowSeconds: 300
  # -------------------------------------------------------------------------
  # Update- und Wartungsverhalten (Aufgabe 6)
  # -------------------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 0 = zu keinem Zeitpunkt weniger als der Sollstand -> kein Unterbruch.
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  image:
    name: user_mgmt_service-backend
    tag: d9badc27cff8bb1f0e6de8f20e47a8e5b8a89449
  service:
    port: 8080
  # Gemessen (kubectl top): ~430Mi unter Last, JVM dimensioniert Heap am Limit, nicht am Request.
  resources:
    requests:
      cpu: 200m
      memory: 448Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # Spring Boot bringt keinen Actuator mit, daher TCP-Probes.
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 30
    readiness:
      periodSeconds: 10
    liveness:
      periodSeconds: 20
# ---------------------------------------------------------------------------
# Frontend (Next.js)
# ---------------------------------------------------------------------------
# Hinweis: NEXT_PUBLIC_API_URL wird von Next.js zur Build-Zeit ins Bundle
# eingebacken (siehe frontend/Dockerfile) und laesst sich hier nicht setzen.
frontend:
  replicaCount: 1
  # Vorbereitet, aber abgeschaltet: Frontend liefert nur statische Seiten, ist nicht der Engpass.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 0
      scaleDown:
        stabilizationWindowSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  image:
    name: user_mgmt_service-frontend
    tag: d9badc27cff8bb1f0e6de8f20e47a8e5b8a89449
  service:
    port: 3000
  # Gemessen: ~127Mi im Leerlauf.
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    startup:
      periodSeconds: 5
      failureThreshold: 24
    readiness:
      periodSeconds: 10
    liveness:
      periodSeconds: 20
# ---------------------------------------------------------------------------
# PostgreSQL
# ---------------------------------------------------------------------------
postgres:
  image:
    registry: docker.io
    repository: library
    name: postgres
    tag: "16-alpine"
  service:
    port: 5432
  # Unterverzeichnis, damit "lost+found" des ext4-Volumes initdb nicht blockiert.
  pgData: /var/lib/postgresql/data/pgdata
  persistence:
    enabled: true
    storageClass: do-block-storage
    accessMode: ReadWriteOnce
    size: 1Gi
    mountPath: /var/lib/postgresql/data
  # Gemessen: ~43Mi im Leerlauf. Der Datenbestand ist klein, PostgreSQL nutzt
  # darueber hinaus den Page Cache des Nodes statt eigenen Speicher.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
# ---------------------------------------------------------------------------
# Nicht sensitive Konfiguration -> ConfigMap
# ---------------------------------------------------------------------------
config:
  postgresDb: postgres
  # "update" statt "create": das PVC ist persistent, das Schema darf beim
  # Pod-Restart nicht neu erzeugt (und damit geleert) werden.
  ddlAuto: update
  jwtIssuer: Spring
  jwtExpirationMillis: "86400000"
# ---------------------------------------------------------------------------
# Sensitive Konfiguration -> Secret
# ---------------------------------------------------------------------------
secrets:
  # false: Secret wird nicht vom Chart verwaltet, sondern einmalig per kubectl angelegt (siehe .ai/KUBERNETES.md).
  # true nur fuer lokales Deployment mit --set, nicht im GitOps-Ablauf.
  create: false
  # Name eines bereits bestehenden Secrets. Leer = "<fullname>-secret".
  existingSecret: ""
  # Werden nur ausgewertet, wenn create=true.
  datasourceUsername: postgres
  datasourcePassword: CHANGEME
  jwtSecret: CHANGEME
# ---------------------------------------------------------------------------
# Ingress
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # Verteilalgorithmus ueber die ready Endpoints; round_robin ist der ingress-nginx-Default.
  loadBalance: round_robin
  hosts:
    - lucavonsaal.com
    - www.lucavonsaal.com
  api:
    # Nur /api/users: /api/login, /api/me, /api/logout sind Next.js Route Handler im Frontend.
    path: /api/users(/|$)(.*)
    rewriteTarget: /users$1$2
  tls:
    enabled: true
    secretName: user-mgmt-tls
    # Clusterweite Infrastruktur, nicht vom Chart verwaltet, sondern von k8s/setup-cluster.sh.
    clusterIssuer: letsencrypt-prod
# ---------------------------------------------------------------------------
# ResourceQuota (pro Namespace/Umgebung, siehe values-staging.yaml/values-prod.yaml)
# ---------------------------------------------------------------------------
resourceQuota:
  enabled: true
  requestsCpu: "1"
  requestsMemory: 2Gi
  limitsCpu: "2"
  limitsMemory: 4Gi
# ---------------------------------------------------------------------------
# NetworkPolicy: erlaubt Traffic nur aus eigenem Namespace und dem Ingress-Controller.
# ---------------------------------------------------------------------------
networkPolicy:
  enabled: true
  allowFromNamespace: ingress-nginx
