apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: user-mgmt
type: Opaque
stringData:
  # DB-Zugangsdaten: werden sowohl von PostgreSQL (POSTGRES_USER/POSTGRES_PASSWORD)
  # als auch vom Backend (SPRING_DATASOURCE_*) verwendet.
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: mysecretpassword

  # HMAC-Signaturschluessel fuer die JWTs
  JWT_SECRET: wIDAQABAkAzGlFARFau7K0b9FcEwIDAQABAkAzGlFARFau7K0b9FcEwIDAQABAkAzGlFARFau7K0b9FcE
