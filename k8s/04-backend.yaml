apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: user-mgmt
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: user-mgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/luclucluca/user_mgmt_service-backend:latest
          # Always: die Pipeline ueberschreibt "latest" bei jedem Push auf main,
          # ohne dies wuerde der Node das gecachte Image weiterverwenden.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # Nicht sensitive Konfiguration aus der ConfigMap,
          # Zugangsdaten und JWT-Secret aus dem Secret.
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          # Spring Boot bringt (noch) keinen Actuator mit, daher TCP-Probes.
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
