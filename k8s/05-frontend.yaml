apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: user-mgmt
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: user-mgmt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/luclucluca/user_mgmt_service-frontend:latest
          # Always: die Pipeline ueberschreibt "latest" bei jedem Push auf main,
          # ohne dies wuerde der Node das gecachte Image weiterverwenden.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          # Hinweis: NEXT_PUBLIC_API_URL wird von Next.js zur Build-Zeit ins
          # Bundle eingebacken (siehe frontend/Dockerfile ARG) und laesst sich
          # hier zur Laufzeit nicht mehr aendern.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
