# Zwei Ingress-Objekte auf denselben Hosts. Die Trennung ist notwendig, weil
# "rewrite-target" eine Annotation auf Ingress-Ebene ist und damit fuer jede
# Pfad-Regel des Objekts gilt: lagen beide Regeln zusammen, haette die Regel "/"
# keine Capture-Group, $2 waere leer und jede Frontend-URL wuerde auf "/"
# umgeschrieben.
#
# TLS: die Annotation "cert-manager.io/cluster-issuer" steht nur an diesem einen
# Objekt. Zwei Objekte mit derselben Annotation und demselben secretName wuerden
# zwei konkurrierende Certificate-Ressourcen auf dasselbe Secret erzeugen.
# Das API-Objekt referenziert das Secret nur.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-mgmt
  namespace: user-mgmt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  # Sobald "tls" gesetzt ist, leitet ingress-nginx HTTP per 308 auf HTTPS um.
  tls:
    - hosts:
        - lucavonsaal.com
        - www.lucavonsaal.com
      secretName: user-mgmt-tls
  rules:
    - host: lucavonsaal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: www.lucavonsaal.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-mgmt-api
  namespace: user-mgmt
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Entspricht dem frueheren Traefik "stripprefix": /api/users -> /users
    nginx.ingress.kubernetes.io/rewrite-target: /users$1$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lucavonsaal.com
        - www.lucavonsaal.com
      secretName: user-mgmt-tls
  rules:
    # nginx bevorzugt die Regex-Location gegenueber der Prefix-Location "/",
    # damit gewinnt /api/users ohne weitere Priorisierung.
    - host: lucavonsaal.com
      http:
        paths:
          # Nur /api/users, nicht /api. Das Frontend hat eigene Next.js Route
          # Handler unter /api/login, /api/me und /api/logout — eine Regel auf
          # /api wuerde die ans Backend schicken, das nur /users/** kennt (403).
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
    - host: www.lucavonsaal.com
      http:
        paths:
          - path: /api/users(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
