apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-mgmt
  namespace: user-mgmt
spec:
  ingressClassName: nginx
  rules:
    - host: app.129.212.140.90.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: user-mgmt-api
  namespace: user-mgmt
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Entspricht dem frueheren Traefik "stripprefix": /api/users -> /users
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: app.129.212.140.90.nip.io
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
