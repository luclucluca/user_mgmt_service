# ClusterIssuer sind clusterweit, nicht per kubectl apply sondern via apply-tls-issuer.sh anwenden (setzt "email").
# Staging zuerst testen: Let's Encrypt Prod hat harte Rate-Limits, Staging nicht.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: PLACEHOLDER_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: PLACEHOLDER_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01: setzt voraus, dass die A-Records auf die LoadBalancer-IP zeigen und Port 80 offen ist.
      - http01:
          ingress:
            ingressClassName: nginx
