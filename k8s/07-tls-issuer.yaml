# ClusterIssuer sind clusterweit (kein namespace) und werden von cert-manager
# bereitgestellt. Die CRDs muessen installiert sein, bevor diese Datei angewendet
# werden kann — siehe setup-cluster.sh.
#
# WICHTIG: "email" unten muss gesetzt werden. Let's Encrypt verlangt eine
# Adresse fuer das ACME-Konto (Ablaufwarnungen). Der Wert steht bereits als
# ACME_EMAIL in der lokalen .env vom Traefik-Setup.
#
# Staging zuerst verwenden: der Produktions-Endpunkt von Let's Encrypt hat harte
# Rate-Limits (5 Fehlversuche pro Konto/Host/Stunde). Staging stellt ein nicht
# vertrauenswuerdiges Zertifikat aus, hat aber grosszuegige Limits und beweist,
# dass die HTTP-01-Challenge durchlaeuft.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: PLACEHOLDER_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: PLACEHOLDER_ACME_EMAIL
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # HTTP-01: cert-manager legt fuer die Challenge temporaer einen eigenen
      # Ingress unter /.well-known/acme-challenge/ an. Setzt voraus, dass die
      # A-Records der Hosts auf die LoadBalancer-IP zeigen und Port 80 offen ist.
      - http01:
          ingress:
            ingressClassName: nginx
