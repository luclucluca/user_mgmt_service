# Werte fuer die ArgoCD-Installation (Helm Chart argo/argo-cd), angewendet von setup-cluster.sh.

global:
  domain: argocd.lucavonsaal.com

configs:
  params:
    # TLS wird am Ingress terminiert, sonst Redirect-Endlosschleife zwischen nginx und argocd-server.
    server.insecure: true

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    # Legt die tls-Section mit secretName "argocd-server-tls" an, die von
    # cert-manager ueber die Annotation oben befuellt wird.
    tls: true
