# Lasttest fuer den HPA-Nachweis (Aufgabe 6), bewusst nicht im Helm Chart (sonst wuerde ArgoCD ihn dauerhaft verwalten).
# Anwenden: kubectl apply -f k8s/loadtest.yaml -n user-mgmt; beobachten: kubectl get hpa,pods -n user-mgmt -w
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hpa-loadtest-script
data:
  loadtest.js: |
    import http from 'k6/http';
    import { check } from 'k6';

    export const options = {
      // Rampe statt konstanter Last, damit Hoch- und Runterskalieren beide sichtbar werden.
      stages: [
        { duration: '1m', target: 20 },   // anfahren
        { duration: '4m', target: 20 },   // Last halten, HPA skaliert hoch
        { duration: '30s', target: 0 },   // abschalten
      ],
      // Fehlerhafte Logins sind hier der Normalfall, keine Schwellwerte noetig.
      thresholds: {},
    };

    // Ueber den ClusterIP-Service statt Ingress, damit DNS/TLS den Test nicht verfaelschen.
    const URL = __ENV.TARGET_URL;

    export default function () {
      const res = http.post(
        URL,
        JSON.stringify({ email: 'loadtest@example.com', password: 'wrong-on-purpose' }),
        { headers: { 'Content-Type': 'application/json' } },
      );
      // 401/403 ist das erwartete Ergebnis - entscheidend ist, dass das
      // Backend geantwortet hat und nicht weggebrochen ist.
      check(res, { 'backend hat geantwortet': (r) => r.status !== 0 });
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hpa-loadtest
spec:
  # Kein Neustart bei Fehlschlag: ein haengender Lasttest soll auffallen,
  # nicht im Hintergrund weiterlaufen.
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:0.49.0
          args: ["run", "/scripts/loadtest.js"]
          env:
            # Der Servicename ist releaseabhaengig. In user-mgmt-staging
            # entsprechend auf user-mgmt-staging-backend anpassen.
            - name: TARGET_URL
              value: "http://user-mgmt-backend:8080/users/login"
          volumeMounts:
            - name: script
              mountPath: /scripts
          # Enge Limits, damit der Lastgenerator dem Backend auf demselben Node keine CPU wegnimmt.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: script
          configMap:
            name: hpa-loadtest-script
