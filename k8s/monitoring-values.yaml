# Werte fuer kube-prometheus-stack (Helm Chart prometheus-community/kube-prometheus-stack),
# angewendet von setup-cluster.sh im Namespace "monitoring".

prometheus:
  prometheusSpec:
    # nil bedeutet sonst "nur ServiceMonitor/PrometheusRule mit Release-Label" - hier bewusst
    # alle Namespaces/Labels zulassen, damit die Objekte aus helm/user-mgmt gefunden werden.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    # Wegwerf-Cluster fuer eine Modulaufgabe - kurze Retention reicht.
    retention: 7d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    route:
      receiver: webhook-notifications
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 3h
      routes:
        # Watchdog ist ein staendig feuernder Selbsttest-Alert von kube-prometheus-stack, kein echter Fehlerzustand.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: webhook-notifications
        webhook_configs:
          # Test-Endpunkt (webhook.site) fuer die Modulabgabe - keine sensiblen Daten im Alert-Payload.
          - url: https://webhook.site/d583e690-a186-4c7f-bf0c-61d144e60ed1
            send_resolved: true

grafana:
  resources:
    # 256Mi Limit fuehrte zu OOMKilled beim Start (Grafana 13.x installiert beim
    # ersten Start mehrere Bundled-Plugins und braucht dafuer kurzzeitig mehr Speicher).
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 300m
      memory: 512Mi
  # Enthaelt u.a. "Kubernetes / Compute Resources / Pod" - deckt die CPU/Memory-Ueberwachung pro Pod ab.
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      # Damit das eigene Dashboard-ConfigMap (k8s/grafana-dashboard-user-mgmt-backend.yaml,
      # Label grafana_dashboard=1) im monitoring-Namespace gefunden wird.
      searchNamespace: ALL
