[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "module-service"
version = "0.1.0"
description = "REST service for managing modules"
requires-python = ">=3.12"
dependencies = [
    # Enger gepinnt als vorher (<1): neuere FastAPI-Versionen aendern die interne
    # Routing-Struktur (_IncludedRouter statt flacher APIRoute-Liste), womit
    # prometheus-fastapi-instrumentator mit AttributeError abstuerzt (jeder Request
    # ausser /docs). <0.116 bleibt auf der Struktur, gegen die die Instrumentator-
    # Version getestet ist.
    "fastapi>=0.115,<0.116",
    "prometheus-fastapi-instrumentator>=7.0,<8",
    "pydantic-settings>=2.8,<3",
    "pymysql[rsa]>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]